[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esf-previsit"
version = "0.2.0"
description = "Schema-grounded pre-visit clinical extraction benchmark and deterministic form projection pipeline"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "pandas>=2.0",
]

[project.optional-dependencies]
retrieval = [
  "scikit-learn>=1.3",
  "scipy>=1.10",
]
hf = ["datasets>=3.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
